services:
  postgres:
    image: postgres:16-alpine
    container_name: ugnay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ugnay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

# NOTE: backend/frontend services will be added here once their Dockerfiles
# exist (see docs/sprint-plan.md, Section 15 of the implementation guide).
# For now, run `npm run dev` in server/ and webapp/ directly against this
# containerized Postgres instance.

volumes:
  ugnay_postgres_data:
